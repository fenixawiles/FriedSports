{% extends "base.html" %}
{% block head %}
<style>
.admin-strip {
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
}
.admin-strip-inner {
  max-width: 1120px; margin: 0 auto; padding: 0 1.5rem;
  height: 38px; display: flex; align-items: center; gap: 0.25rem;
}
.admin-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-secondary);
  margin-right: 1rem; display: flex; align-items: center; gap: 0.4rem;
}
.admin-label::before {
  content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--text-secondary);
}
.admin-nav-link {
  font-size: 0.8rem; color: var(--text-muted); padding: 0.3rem 0.6rem;
  border-radius: var(--radius-sm); transition: color 0.12s;
  text-decoration: none;
}
.admin-nav-link:hover { color: var(--text-primary); }
.admin-nav-link.active { color: var(--text-primary); }
</style>
{% endblock %}
{% block content %}
<nav class="admin-strip">
  <div class="admin-strip-inner">
    <span class="admin-label">Admin</span>
    <a href="{{ url_for('admin.tools_dashboard') }}" class="admin-nav-link {% if request.endpoint == 'admin.tools_dashboard' %}active{% endif %}">Overview</a>
    <a href="{{ url_for('admin.users_list') }}" class="admin-nav-link {% if 'admin.users' in request.endpoint %}active{% endif %}">Users</a>
    <a href="{{ url_for('admin.audit_log') }}" class="admin-nav-link {% if request.endpoint == 'admin.audit_log' %}active{% endif %}">Audit Log</a>
    <a href="{{ url_for('admin.reports_list') }}" class="admin-nav-link {% if 'admin.reports' in request.endpoint %}active{% endif %}">Reports</a>
    <a href="{{ url_for('admin.support_list') }}" class="admin-nav-link {% if 'admin.support' in request.endpoint %}active{% endif %}">Support</a>
    <a href="{{ url_for('admin.broadcast') }}" class="admin-nav-link {% if request.endpoint == 'admin.broadcast' %}active{% endif %}">Broadcast</a>
    <a href="{{ url_for('admin.push_tools') }}" class="admin-nav-link {% if request.endpoint == 'admin.push_tools' %}active{% endif %}">Push</a>
  </div>
</nav>
{% block tools_content %}{% endblock %}
{% endblock %}
