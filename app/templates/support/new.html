{% extends "base.html" %}
{% block title %}Report an Issue — FriedSports{% endblock %}
{% block content %}
<div class="group-container" style="max-width:640px">

  <div class="thread-header">
    <a href="{{ url_for('support.index') }}" class="back-link">← Support</a>
    <h1 class="thread-title-large">Report an Issue</h1>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem">We'll look into it and keep you posted by email.</p>
  </div>

  <section class="group-section" style="border-top:none;padding-top:0">
    <form method="post" action="{{ url_for('support.new') }}" class="auth-form">

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required maxlength="200"
               placeholder="Brief description of the issue"
               value="{{ request.form.get('subject', '') }}">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" class="team-select">
          {% for val, label in categories %}
          <option value="{{ val }}" {% if request.form.get('category', 'other') == val %}selected{% endif %}>
            {{ label }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6" required
                  placeholder="What happened? What did you expect? Any steps to reproduce?"
                  style="resize:vertical">{{ request.form.get('description', '') }}</textarea>
      </div>

      <button type="submit" class="btn-primary btn-full">Submit Report</button>
    </form>
  </section>

</div>
{% endblock %}
