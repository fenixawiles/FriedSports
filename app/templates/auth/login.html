{% extends "base.html" %}
{% block title %}Log In — FriedSports{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Your group has been talking while you were gone.</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required
               placeholder="your@email.com" value="{{ request.form.get('email', '') }}">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Your password">
      </div>
      <button type="submit" class="btn-primary btn-full">Log In</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
