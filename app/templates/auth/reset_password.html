{% extends "base.html" %}
{% block title %}Reset Password — FriedSports{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Set New Password</h1>
    <p class="auth-sub">Choose a new password for your account. Must be at least 6 characters.</p>
    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required
               minlength="6" placeholder="At least 6 characters"
               autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               minlength="6" placeholder="Repeat your new password"
               autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary btn-full">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
{% block footer %}
<footer class="site-footer">
  <span>© 2025 FriedSports</span>
  <a href="{{ url_for('legal.privacy') }}">Privacy Policy</a>
  <a href="{{ url_for('legal.terms') }}">Terms</a>
</footer>
{% endblock %}
